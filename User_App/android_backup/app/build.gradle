plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" version "4.3.15" apply false
}

android {
    namespace = "com.user.resqbox"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.user.resqbox"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Force emoji2 version to fix Stripe crash
    configurations.all {
        resolutionStrategy {
            force 'androidx.emoji2:emoji2:1.3.0'
            force 'androidx.emoji2:emoji2-views:1.3.0'
            force 'androidx.emoji2:emoji2-views-helper:1.3.0'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Fix for Stripe EmojiCompat crash - use version with getEmojiStart method
    // This resolves: NoSuchMethodError: No virtual method getEmojiStart
    // Required for Stripe payment sheet text input handling
    implementation 'androidx.emoji2:emoji2:1.3.0'
    implementation 'androidx.emoji2:emoji2-views:1.3.0'
    implementation 'androidx.emoji2:emoji2-views-helper:1.3.0'
}
